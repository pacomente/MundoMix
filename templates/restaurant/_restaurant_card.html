<article class="restaurant-card"><a href="{{ url_for('restaurants.detail',slug=r.slug) }}" class="restaurant-card-media">{% if r.banner_url or r.banner %}<img src="{{ image_src(r.banner_url, r.banner) }}" alt="{{ r.name }}">{% elif r.logo_url or r.logo %}<img src="{{ image_src(r.logo_url, r.logo) }}" alt="{{ r.name }}">{% else %}<span>🍔</span>{% endif %}</a><div class="restaurant-card-body"><div class="restaurant-card-top"><h3>{{ r.name }}</h3><span class="open-pill {{ 'open' if restaurant_is_open(r) else 'closed' }}">{{ '🟢 Abierto' if restaurant_is_open(r) else '🔴 Cerrado' }}</span></div><p>{{ r.description or r.food_type }}</p><div class="restaurant-card-meta">🍽 {{ r.food_type or 'Gastronomía' }}{% if r.address %} · 📍 {{ r.address }}{% endif %}</div><a class="btn full" href="{{ url_for('restaurants.detail',slug=r.slug) }}">Ver menú →</a></div></article>
