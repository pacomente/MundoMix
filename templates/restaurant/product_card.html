<article class="food-product"><div class="food-image">{% if p.image %}<img src="{{ url_for('uploaded_file',filename=p.image) }}" alt="{{ p.name }}">{% else %}<span>🍔</span>{% endif %}</div><div class="food-content"><div><h4>{{ p.name }}</h4><p>{{ p.description }}</p></div><div class="food-bottom"><strong>${{ "{:,.0f}".format(p.price_delivery) }}</strong>{% if p.stock <= 5 %}<small class="stock-note">{{ p.stock_label }}</small>{% endif %}<form method="post" action="{{ url_for('restaurant_cart.add',slug=restaurant.slug,product_id=p.id) }}"><input type="hidden" name="quantity" value="1"><input type="hidden" name="next" value="{{ request.path }}"><button class="btn add-food" {% if not p.available or (not restaurant_is_open and not restaurant.accept_orders_closed) %}disabled{% endif %}>Agregar</button></form></div></div></article>
