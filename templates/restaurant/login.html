<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso comercio — MundoMix</title><link rel="stylesheet" href="{{ url_for('static',filename='css/main.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/restaurant.css') }}"></head><body class="commerce-login"><div class="login-box"><div class="brand">Mundo<span>Mix</span></div><span class="eyebrow">PANEL DE COMERCIO</span><h1>Ingresar</h1><p>Administrá tu menú y tus pedidos.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}{% endwith %}<form method="post"><label>Usuario<input name="username" required autocomplete="username"></label><label>Contraseña<input type="password" name="password" required autocomplete="current-password"></label><button class="btn full">Ingresar</button></form></div></body></html>
