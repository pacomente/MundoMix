{% extends "admin/base.html" %}{% block content %}<div class="page-title"><div><span>NEGOCIO</span><h1>Configuración</h1><p>Personalizá la información que ve tu cliente.</p></div></div><form method="post" class="panel form-grid settings-form"><label>Nombre del negocio<input name="store_name" value="{{ settings.get('store_name','MundoMix') }}"></label><label>WhatsApp<input name="whatsapp_number" value="{{ settings.get('whatsapp_number','') }}" placeholder="549291..." inputmode="tel"><small>Formato internacional, sin +, espacios ni guiones.</small></label><label>Instagram<input name="instagram" value="{{ settings.get('instagram','') }}" placeholder="@mundomix"></label><label>Facebook<input name="facebook" value="{{ settings.get('facebook','') }}"></label><label>Contacto<input name="contact" value="{{ settings.get('contact','') }}"></label><label>Horarios<input name="business_hours" value="{{ settings.get('business_hours','') }}"></label><label>Dirección de retiro<input name="pickup_address" value="{{ settings.get('pickup_address','') }}"></label><label class="wide">Descripción<textarea name="description" rows="4">{{ settings.get('description','') }}</textarea></label><label class="wide">Información de envíos<textarea name="delivery_info" rows="4">{{ settings.get('delivery_info','') }}</textarea></label><div class="wide"><button class="btn">Guardar configuración</button></div></form>{% endblock %}
