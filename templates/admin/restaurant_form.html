{% extends "admin/base.html" %}{% block title %}Editar local — MundoMix{% endblock %}{% block content %}<div class="page-title"><div><span>MARKETPLACE</span><h1>Editar local</h1><p>{{ restaurant.name }} · /comida/{{ restaurant.slug }}</p></div><a class="btn" href="{{ url_for('restaurants.detail',slug=restaurant.slug) }}" target="_blank">Ver tienda →</a></div><div class="panel"><form method="post" class="form-grid"><label>Nombre *<input name="name" value="{{ restaurant.name }}" required></label><label>Tipo de comida<input name="food_type" value="{{ restaurant.food_type }}"></label><label class="wide">Descripción<textarea name="description" rows="4">{{ restaurant.description }}</textarea></label><label>Dirección<input name="address" value="{{ restaurant.address }}"></label><label>Teléfono<input name="phone" value="{{ restaurant.phone }}"></label><label>WhatsApp<input name="whatsapp" value="{{ restaurant.whatsapp }}"></label><label>Instagram<input name="instagram" value="{{ restaurant.instagram }}"></label><label>Facebook<input name="facebook" value="{{ restaurant.facebook }}"></label><label>Usuario<input name="username" value="{{ user.username if user else '' }}"></label><label>Nueva contraseña<input type="password" name="password" minlength="8" placeholder="Dejar vacío para mantenerla"></label><label class="check wide"><input type="checkbox" name="active" {% if restaurant.active %}checked{% endif %}> Local activo</label><label class="check wide"><input type="checkbox" name="accept_orders_closed" {% if restaurant.accept_orders_closed %}checked{% endif %}> Aceptar pedidos fuera de horario</label><button class="btn wide">Guardar cambios</button></form></div>{% endblock %}
