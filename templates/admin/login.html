<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso — MundoMix</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/admin.css') }}"></head><body class="login"><form method="post" class="login-card"><div class="login-logo">Mundo<span>Mix</span></div><span class="eyebrow">ADMINISTRACIÓN</span><h1>Bienvenido de nuevo</h1><p>Ingresá para administrar tu tienda.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}{% endwith %}<label>Usuario<input name="username" autocomplete="username" placeholder="Usuario" required></label><label>Contraseña<input type="password" name="password" autocomplete="current-password" placeholder="Contraseña" required></label><button class="btn full">Ingresar →</button></form></body></html>
