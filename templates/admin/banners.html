{% extends "admin/base.html" %}{% block content %}<div class="page-title"><div><span>HOME</span><h1>Banners</h1><p>Gestioná las piezas principales de la portada.</p></div></div><section class="panel"><h2>Nuevo banner</h2><form method="post" enctype="multipart/form-data" class="form-grid"><label>Título<input name="title"></label><label>Subtítulo<input name="subtitle"></label><label>Texto del botón<input name="button_text" placeholder="Ver productos"></label><label>URL del botón<input name="button_url" placeholder="/catalogo"></label><label>Orden<input type="number" name="display_order" value="0"></label><label>Imagen *<input type="file" name="image" required accept=".jpg,.jpeg,.png,.webp"></label><label class="check"><input type="checkbox" name="active" checked> Activo</label><div class="wide"><button class="btn">Crear banner</button></div></form></section><section class="banner-admin-grid">{% for b in banners %}<article class="banner-admin"><img src="{{ url_for('uploaded_file',filename=b.image) }}" alt="{{ b.title }}"><div class="banner-content"><span class="tag">Orden {{ b.display_order }}</span><h3>{{ b.title or 'Sin título' }}</h3><p>{{ b.subtitle }}</p><form method="post" action="{{ url_for('admin.banner_edit',id=b.id) }}" enctype="multipart/form-data" class="mini-form"><input name="title" value="{{ b.title }}"><input name="subtitle" value="{{ b.subtitle }}"><input name="button_text" value="{{ b.button_text }}"><input name="button_url" value="{{ b.button_url }}"><input type="number" name="display_order" value="{{ b.display_order }}"><input type="file" name="image" accept=".jpg,.jpeg,.png,.webp"><label class="check"><input type="checkbox" name="active" {% if b.active %}checked{% endif %}> Activo</label><button class="btn">Guardar cambios</button></form><div class="actions"><form method="post" action="{{ url_for('admin.banner_toggle',id=b.id) }}"><button>{{ 'Desactivar' if b.active else 'Activar' }}</button></form><form method="post" action="{{ url_for('admin.banner_delete',id=b.id) }}" onsubmit="return confirm('¿Eliminar banner?')"><button class="danger-link">Eliminar</button></form></div></div></article>{% else %}<div class="empty-row">No hay banners.</div>{% endfor %}</section>{% endblock %}
