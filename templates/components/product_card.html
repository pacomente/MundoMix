<article class="product-card">
<a href="{{ url_for('store.product',slug=p.slug) }}" class="product-img">
{% if p.image %}<img loading="lazy" src="{{ image_url(p.cloudinary_public_id, p.image, 600, 600) }}" alt="{{ p.name }}">{% else %}<div class="no-image">MundoMix</div>{% endif %}
{% if p.featured %}<span class="product-badge">Destacado</span>{% endif %}{% if p.stock <= 0 %}<span class="product-badge out">Agotado</span>{% endif %}
</a>
<div class="product-body"><span class="product-cat">{{ p.category.name if p.category else 'Producto' }}</span><h3><a href="{{ url_for('store.product',slug=p.slug) }}">{{ p.name }}</a></h3><div class="prices"><strong>${{ "{:,.0f}".format(p.price_delivery) }}</strong><small>Envío incluido</small></div><div class="card-actions"><a class="btn small" href="{{ url_for('store.product',slug=p.slug) }}">Ver producto</a></div></div>
</article>
